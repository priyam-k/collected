# Override that builds the image here instead of pulling it from GHCR:
#   GIT_SHA=$(git rev-parse --short HEAD) BUILT_AT=$(date -u +%FT%TZ) \
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Without GIT_SHA the server reports commit "dev" and the update check has nothing to compare. Not for a 1 GB box:
# the Vite build needs ~500 MB (artifacts/SETUP.md step 7).
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILT_AT: ${BUILT_AT:-}
    # Overrides the GHCR tag in docker-compose.yml so `up -d` runs what was just built and never pulls over it.
    image: collected:local
