# Publishes the CLI (`agent/`, npm package `collected-cli`) when a tag `cli-v<version>` is pushed.
#
# Needs, on the repo:
#   secrets COLLECTED_GOOGLE_DESKTOP_CLIENT_ID / _SECRET  the Desktop-app OAuth client the CLI's local mode ships (SETUP.md Google step 9)
#   secret  HOMEBREW_TAP_TOKEN (optional)                 a fine-grained PAT that lets the `brew` job push the formula to the tap
#                                                         priyam-k/homebrew-collected: resource owner priyam-k, repository access
#                                                         "Only select repositories" → homebrew-collected, repository permission
#                                                         Contents: Read and write, nothing else. Without it the publish still
#                                                         happens and the `brew` job prints what to do instead of failing.
#
# No npm token: the package trusts this workflow (npmjs.com → collected-cli → Settings → Trusted publishers: GitHub
# Actions, priyam-k/collected, release.yml, no environment, publish allowed). pnpm exchanges the job's OIDC token for a
# short-lived npm credential, and the publish is signed with provenance (`id-token: write` + `--provenance`), so npm
# shows the exact workflow run and commit the tarball came from. Nothing here deploys anything; `deploy.yml` owns the server.
# Every action is pinned to a commit (same SHAs as ci.yml); Dependabot proposes bumps.
name: release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test

      # The tag must name the version in agent/package.json, so a stale tag cannot publish the wrong build.
      - name: Check tag matches package version
        run: |
          want="cli-v$(node -p "require('./agent/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match $want"; exit 1; }

      # The package carries the dashboard (agent/dist/web), so the web build comes first; the CLI build refuses to run without it.
      - run: pnpm --filter web build
      - run: pnpm --filter collected-cli build
        env:
          # The CLI's built-in Google desktop client (agent/src/google-client.ts); baked into the bundle, never committed.
          COLLECTED_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.COLLECTED_GOOGLE_DESKTOP_CLIENT_ID }}
          COLLECTED_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.COLLECTED_GOOGLE_DESKTOP_CLIENT_SECRET }}
      - name: Check the bundle carries the Google desktop client
        run: |
          grep -q 'apps.googleusercontent.com' agent/dist/*.js || { echo 'no Google desktop client in the bundle; set the COLLECTED_GOOGLE_DESKTOP_CLIENT_* secrets' >&2; exit 1; }

      # The guard against an uninstallable package (1.1.0 shipped one): pack, install the tarball into an empty project
      # outside the repo with real dependency resolution, and run local mode end to end, the dashboard included.
      - name: Pack, install and smoke-test the package
        run: node scripts/smoke-cli-package.mjs

      - run: pnpm --filter collected-cli publish --no-git-checks --provenance --access public

  # Points the Homebrew tap (priyam-k/homebrew-collected, `brew install priyam-k/collected/collected-cli`) at the version
  # just published. The formula's template lives here in homebrew/Formula/collected-cli.rb; scripts/bump-formula.mjs
  # rewrites its url and sha256 from the tarball the registry serves (the registry lags a publish, so it waits up to
  # five minutes), and the result is committed to the tap as "collected-cli <version>". The template in this repo is not
  # committed back; run the script locally when you want it to catch up. Only the publish needs the OIDC token, so this
  # job has none.
  brew:
    needs: publish
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Point the formula at the published tarball
        run: node scripts/bump-formula.mjs "${GITHUB_REF_NAME#cli-v}" --wait 300
      - name: Push the formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: priyam-k/homebrew-collected
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap $TAP_REPO was not updated to $version."
            echo "Create a fine-grained PAT (resource owner priyam-k, only $TAP_REPO, Contents: Read and write), store it as"
            echo "the repository secret HOMEBREW_TAP_TOKEN, and re-run this job; or by hand: node scripts/bump-formula.mjs $version,"
            echo "then copy homebrew/Formula/collected-cli.rb and homebrew/README.md into the tap and commit."
            exit 0
          fi
          # The token travels in a header git reads from config, never on the command line or in the remote URL.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" clone --quiet "https://github.com/$TAP_REPO.git" tap
          cd tap
          git config "http.https://github.com/.extraheader" "$auth"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A tap created empty has no branch yet; a tap with history is on its default branch. Either way: main.
          git checkout -B main
          mkdir -p Formula
          cp ../homebrew/Formula/collected-cli.rb Formula/collected-cli.rb
          cp ../homebrew/README.md README.md
          git add Formula/collected-cli.rb README.md
          if git diff --cached --quiet; then
            echo "the tap already names collected-cli $version; nothing to push"
            exit 0
          fi
          git commit --quiet -m "collected-cli $version"
          git push --quiet origin HEAD:main
          echo "pushed collected-cli $version to $TAP_REPO"
