# Publishes the CLI (`agent/`, npm package `collected-cli`) when a tag `cli-v<version>` is pushed.
#
# Needs, on the repo:
#   secret NPM_TOKEN   an npm granular access token, publish-only, limited to the package `collected-cli`
#                      (npmjs.com → Access Tokens → Generate New Token → Granular; packages and scopes: only
#                      collected-cli, permissions: read and write; no org or user permissions). Rotate it when it expires.
#
# The publish is signed with provenance (`id-token: write` + `--provenance`), so npm shows the exact workflow run and
# commit the tarball came from. Nothing here deploys anything; `deploy.yml` owns the server.
# Every action is pinned to a commit (same SHAs as ci.yml); Dependabot proposes bumps.
name: release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test

      # The tag must name the version in agent/package.json, so a stale tag cannot publish the wrong build.
      - name: Check tag matches package version
        run: |
          want="cli-v$(node -p "require('./agent/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match $want"; exit 1; }

      # The package carries the dashboard (agent/dist/web), so the web build comes first; the CLI build refuses to run without it.
      - run: pnpm --filter web build
      - run: pnpm --filter collected-cli build

      # The guard against an uninstallable package (1.1.0 shipped one): pack, install the tarball into an empty project
      # outside the repo with real dependency resolution, and run local mode end to end, the dashboard included.
      - name: Pack, install and smoke-test the package
        run: node scripts/smoke-cli-package.mjs

      - run: pnpm --filter collected-cli publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
