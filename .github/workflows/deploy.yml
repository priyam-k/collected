# Builds the production image on every push to main and ships it to the box.
#
# The box (a 1 GB e2-micro) cannot build the image itself, so the runner does what the Mac used to do by hand:
# typecheck + test → docker build → save as a tarball → scp → docker load → compose up → wait for /api/health.
# No registry: a tarball over SSH has no storage or transfer quota and is the flow that was already proven.
#
# Two jobs on purpose. `build` runs the third-party actions and has no secrets; `deploy` has only the SSH key,
# runs in the `production` environment (required reviewer, artifacts/SETUP.md Phase 2 step 9), and only in this
# repo, never in a fork. Every action is pinned to a commit; Dependabot proposes bumps.
#
# Needs, on the repo:
#   secret DEPLOY_HOST     the box's public IP (a secret so it is masked in logs, which are public once the repo is)
#   secret DEPLOY_USER     the login user on the box (member of the docker group)
#   secret DEPLOY_SSH_KEY  private half of a keypair whose public half is in the instance's ssh-keys metadata
#   variable DEPLOY_REPO   "<you>/collected": the one repository allowed to run the deploy job (forks skip it)
#   secret DEPLOY_HOST_KEY the box's SSH host key line, so nothing can impersonate it. Get it with:
#                          ssh-keyscan -t ed25519 <host> 2>/dev/null   (one line: "<host> ssh-ed25519 AAAA...")
#                          and set it again whenever the box is rebuilt.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A second push queues behind the first instead of cancelling it mid-restart.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ---- gate: the same checks the Mac ran before a manual build ----
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0 (version comes from "packageManager" in package.json)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test

      # ---- build ----
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Tagged `candidate`, not `latest`: `docker load` on the box must not replace the running image's tag.
          # scripts/deploy.sh promotes it to latest only after the health check passes.
          tags: collected:candidate
          # Write the image to a tarball instead of pushing to a registry.
          outputs: type=docker,dest=/tmp/collected.tar
          # The running build reports this commit (/api/system/version) and the update check compares it with main.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          # Layer cache in GitHub's cache store: unchanged stages (pnpm install, the web build) are reused next run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: gzip -1 /tmp/collected.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collected-image
          path: /tmp/collected.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    # Only the repository that owns the box deploys: set the repository variable DEPLOY_REPO to "<you>/collected"
    # (Settings → Secrets and variables → Actions → Variables). A fork without it builds but never deploys.
    if: github.repository == vars.DEPLOY_REPO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collected-image
          path: /tmp

      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The box's host key, pinned so nothing can impersonate it (secret DEPLOY_HOST_KEY, see the header).
          [ -n "$HOST_KEY" ] || { echo "DEPLOY_HOST_KEY is not set: ssh-keyscan -t ed25519 <host>"; exit 1; }
          # Accept the full ssh-keyscan line or just "ssh-ed25519 AAAA...": keep the last two fields (type, key) and
          # pin them to HOST, so stray whitespace, a hostname that differs from HOST, or a copied comment cannot break it.
          set -- $HOST_KEY; while [ $# -gt 2 ]; do shift; done
          printf '%s %s %s\n' "$HOST" "$1" "$2" > ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null || { echo "known_hosts has no entry for the host"; exit 1; }
          echo "pinned host key fingerprint:"; ssh-keygen -lf ~/.ssh/known_hosts
          printf 'Host box\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' "$HOST" "$USER" > ~/.ssh/config

      - name: Upload image
        run: scp /tmp/collected.tar.gz box:/tmp/collected.tar.gz

      # scripts/deploy.sh (from the commit just pulled): backup → load candidate → latest becomes prev → candidate
      # becomes latest → compose up → wait for /api/health; on failure it re-tags prev as latest, restarts, prints
      # `docker compose ps` (no app logs: workflow logs are world-readable on a public repo) and exits 1.
      - name: Deploy
        run: ssh box 'cd /srv/collected && git pull --ff-only && sh scripts/deploy.sh /tmp/collected.tar.gz'
