# Builds the production image on every push to main and ships it to the box.
#
# The box (a 1 GB e2-micro) cannot build the image itself, so the runner does what the Mac used to do by hand:
# typecheck + test → docker build → save as a tarball → scp → docker load → compose up → wait for /api/health.
# No registry: a tarball over SSH has no storage or transfer quota and is the flow that was already proven.
#
# Needs, on the repo (artifacts/SETUP.md, Phase 2 step 8):
#   variable DEPLOY_HOST  the box's public IP
#   variable DEPLOY_USER  the login user on the box (member of the docker group)
#   secret   DEPLOY_SSH_KEY  private half of a keypair whose public half is in the instance's ssh-keys metadata
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second push queues behind the first instead of cancelling it mid-restart.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      # ---- gate: the same checks the Mac ran before a manual build ----
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # ---- build ----
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: collected:latest
          # Write the image to a tarball instead of pushing to a registry.
          outputs: type=docker,dest=/tmp/collected.tar
          # Layer cache in GitHub's cache store: unchanged stages (pnpm install, the web build) are reused next run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: gzip -1 /tmp/collected.tar

      # ---- ship ----
      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The box's host key, pinned so nothing can impersonate it. If the box is rebuilt: ssh-keyscan -t ed25519 <host>
          echo "$HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBP7zLof6+vKOiihD5XFuXK2nvJFw5BbjgxwAUCUcNyD" > ~/.ssh/known_hosts
          printf 'Host box\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' "$HOST" "$USER" > ~/.ssh/config

      - name: Upload image
        run: scp /tmp/collected.tar.gz box:/tmp/collected.tar.gz

      - name: Load and restart
        run: |
          ssh box 'set -e
            cd /srv/collected
            git pull --ff-only
            # Keep the outgoing image as collected:prev. Rollback on the box is:
            #   docker tag collected:prev collected:latest && docker compose up -d
            docker tag collected:latest collected:prev 2>/dev/null || true
            gunzip -c /tmp/collected.tar.gz | docker load
            rm -f /tmp/collected.tar.gz
            docker compose up -d
            docker image prune -f >/dev/null'

      - name: Wait for healthy
        run: |
          # Right after a restart the box is busy (image load, migrations, six boot-time syncs); allow a few minutes.
          for i in $(seq 1 36); do
            if ssh box 'curl -fsS --max-time 5 http://127.0.0.1:3000/api/health' 2>/dev/null; then echo; echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "app did not become healthy within 3 minutes"
          ssh box 'cd /srv/collected && docker compose ps && docker compose logs --tail 40 app'
          exit 1
