packages:
  - shared
  - core
  - server
  - web
  - agent
  - e2e

# pnpm 12 blocks postinstall scripts unless allowed here.
allowBuilds:
  esbuild: true

# Transitive deps with advisories that the direct dependency has not bumped yet (pnpm audit --prod).
overrides:
  undici: ">=7.30.1"
  "brace-expansion@>=2.0.0 <2.1.7": ">=2.1.7"
